<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="calculator-container">
        <div id="result-screen"><span id="input-number" class="reset">0</span></div>
        <div id="buttons-container">


            <div id="left-container">
                <div id="row">
                    <button type="button" id="delete-btn" name="delete" class="delete-btn light-gray btn">delete</button>
                    <button type="button" id="clear-btn" name="clear" class="clear-btn light-gray btn">clear</button>
                    <button type="button" id="percentage-btn" name="percentage" class="percentage-btn light-gray btn">percentage</button>
                </div>
                <div id="row">
                    <button type="button" id="seven-btn" name="seven" class="gray numerical-btn btn">7</button>
                    <button type="button" id="eight-btn" name="eight" class="gray numerical-btn btn">8</button>
                    <button type="button" id="nine-btn" name="nine" class="gray numerical-btn btn">9</button>
                </div>
                <div id="row">
                    <button type="button" id="four-btn" name="four" class="gray numerical-btn btn">4</button>
                    <button type="button" id="five-btn" name="five" class="gray numerical-btn btn">5</button>
                    <button type="button" id="six-btn" name="six" class="gray numerical-btn btn">6</button>
                </div>
                <div id="row">
                    <button type="button" id="one-btn" name="one" class="gray numerical-btn btn">1</button>
                    <button type="button" id="two-btn" name="two" class="gray numerical-btn btn">2</button>
                    <button type="button" id="three-btn" name="three" class="gray numerical-btn btn">3</button>
                </div>
                <div id="row">
                    <button type="button" id="zero-btn" name="zero" class="gray numerical-btn btn">0</button>
                    <button type="button" id="dot-btn" name="dot" class="gray btn">dot</button>
                </div>

            </div>
            <div id="right-container">
                <button type="button" id="divide-btn" name="divide" class="orange operator-btn divide-btn btn">divide</button>
                <button type="button" id="multiply-btn" name="multiply" class="orange operator-btn multiply-btn btn">multiply</button>
                <button type="button" id="subtract-btn" name="subtract" class="orange operator-btn subtract-btn btn">subtract</button>
                <button type="button" id="add-btn" name="add" class="orange operator-btn add-btn btn">add</button>
                <button type="button" id="result-btn" name="result" class="orange operator-btn result-btn btn">result</button>
            </div>
        </div>

    </div>
</body>

</html>
