<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container">
        <div id="calculator">
            <div id="result-screen">
                <div class="alignment"></div>
                <div class="alignment"></div>
                <div class="alignment"></div>
                <span id="input-number" class="reset">0</span>
            </div>
            <div id="row">
                <button type="button" id="delete-btn" name="delete" class="delete-btn light-gray btn misc-btn"><i
                        class="bi bi-backspace"></i></button>
                <button type="button" id="clear-btn" name="clear" class="clear-btn light-gray btn misc-btn">CE</button>
                <button type="button" id="percentage-btn" name="percentage"
                    class="percentage-btn light-gray btn misc-btn"><i class="bi bi-percent"></i></button>
                <button type="button" id="divide-btn" name="divide" class="orange operator-btn divide-btn btn"><span
                        style="font-size: 100%;">&#xF7;</span></button>
            </div>
            <div id="row">
                <button type="button" id="seven-btn" name="seven" class="dark-gray numerical-btn btn">7</button>
                <button type="button" id="eight-btn" name="eight" class="dark-gray numerical-btn btn">8</button>
                <button type="button" id="nine-btn" name="nine" class="dark-gray numerical-btn btn">9</button>
                <button type="button" id="multiply-btn" name="multiply" class="orange operator-btn multiply-btn btn"><i
                        class="bi bi-x"></i></button>
            </div>
            <div id="row">
                <button type="button" id="four-btn" name="four" class="dark-gray numerical-btn btn">4</button>
                <button type="button" id="five-btn" name="five" class="dark-gray numerical-btn btn">5</button>
                <button type="button" id="six-btn" name="six" class="dark-gray numerical-btn btn">6</button>
                <button type="button" id="subtract-btn" name="subtract" class="orange operator-btn subtract-btn btn"><i
                        class="bi bi-dash"></i></button>
            </div>
            <div id="row">
                <button type="button" id="one-btn" name="one" class="dark-gray numerical-btn btn">1</button>
                <button type="button" id="two-btn" name="two" class="dark-gray numerical-btn btn">2</button>
                <button type="button" id="three-btn" name="three" class="dark-gray numerical-btn btn">3</button>
                <button type="button" id="add-btn" name="add" class="orange operator-btn add-btn btn">
                    <i class="bi bi-plus-lg"></i></button>
            </div>
            <div id="row">
                <button type="button" id="zero-btn" name="zero" class="dark-gray numerical-btn btn double-sized">
                    <span class="align-left">0</span></button>
                <button type="button" id="dot-btn" name="dot" class="dark-gray btn">.</button>
                <button type="button" id="result-btn" name="result"
                    class="orange operator-btn result-btn btn"><span>&#61;</span></button>
            </div>

            <div class="tutorial-container">
                <h2>You can use your keyboard!</h2>
                <ul>
                    <li>'C' key works as the Clear button.</li>
                </ul>
            </div>
        </div>

    </div>

</body>

</html>
